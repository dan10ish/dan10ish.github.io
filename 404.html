<!DOCTYPE html>
<html lang="en" data-theme="gray">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 | Danish</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" href="/icon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="/icon.png"/>
  <style>
    @font-face{font-family:'SF Mono';src:url('/fonts/SFMono-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
    @font-face{font-family:'SF Mono';src:url('/fonts/SFMono-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:'SF Mono';src:url('/fonts/SFMono-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
    [data-theme="gray"]{--background:#FFFFFF;--foreground:#111827;--border:#D1D5DB;--chevron:#9CA3AF;--social-hover-bg:rgba(0,0,0,0.05);--link-blue:#2563EB;color-scheme:light}
    [data-theme="green"]{--background:#0f2015;--foreground:#80e3c2;--border:#1a3826;--chevron:#529e85;--social-hover-bg:rgba(255,255,255,0.08);--link-blue:#7BC9F8;color-scheme:dark}
    [data-theme="onyx"]{--background:#111111;--foreground:#EDEDED;--border:#2C2C2E;--chevron:#666666;--social-hover-bg:rgba(255,255,255,0.1);--link-blue:#38BDF8;color-scheme:dark}
    [data-theme="solarized"]{--background:#002B36;--foreground:#EEE8D5;--border:#073642;--chevron:#586E75;--social-hover-bg:rgba(255,255,255,0.06);--link-blue:#4FA3DE;color-scheme:dark}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{background-color:var(--background);color:var(--foreground);font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100dvh}
    a{text-decoration:none;color:inherit}
    button{font-family:inherit}
    @keyframes page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    #page-wrap{animation:page-in 0.25s ease-out both}
    main{max-width:800px;padding:48px 24px;min-height:100dvh}
    @media(min-width:768px){main{padding-left:40px;padding-right:40px}}
    @media(min-width:1024px){main{padding-left:48px;padding-right:48px}}
    .stack{display:flex;flex-direction:column;gap:24px}
    .notfound-btn{
      display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
      padding:3px 12px;border-radius:6px;
      background:color-mix(in srgb,var(--link-blue) 12%,transparent);
      color:var(--link-blue);transition:transform 0.1s ease-out
    }
    @media(hover:hover),(any-hover:hover){
      .notfound-btn:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--link-blue) 22%,transparent)}
    }
    #theme-btn{position:fixed;bottom:24px;right:24px;padding:8px;border:none;background:transparent;color:var(--foreground);border-radius:50%;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
    #theme-btn:focus{outline:none}
    #contrast-path{transform-origin:left center;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1)}
    [data-theme="gray"] #contrast-path{transform:rotate(0deg)}
    [data-theme="green"] #contrast-path{transform:rotate(90deg)}
    [data-theme="onyx"] #contrast-path{transform:rotate(180deg)}
    [data-theme="solarized"] #contrast-path{transform:rotate(270deg)}
  </style>
</head>
<body>
  <div id="page-wrap">
    <main>
      <div class="stack">
        <header>
          <h1 style="font-size:14px;font-weight:500;line-height:1.375">404</h1>
        </header>
        <p style="font-size:14px;font-weight:400;line-height:1.375">Page Not Found</p>
        <nav>
          <a href="/" class="notfound-btn">

            </svg>
            Home
          </a>
        </nav>
      </div>
    </main>
  </div>

  <button id="theme-btn" aria-label="Toggle theme">
    <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10"/>
      <path id="contrast-path" d="M12 18a6 6 0 0 0 0-12v12z"/>
    </svg>
  </button>

  <script>
    (function(){
      var THEMES=['gray','green','onyx','solarized'];
      var html=document.documentElement;
      function getSaved(){try{return localStorage.getItem('theme')}catch(e){return null}}
      function save(t){try{localStorage.setItem('theme',t)}catch(e){}}
      var saved=getSaved();
      if(saved&&THEMES.indexOf(saved)!==-1)html.setAttribute('data-theme',saved);
      document.getElementById('theme-btn').addEventListener('click',function(){
        var cur=html.getAttribute('data-theme')||'gray';
        var next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
        html.setAttribute('data-theme',next);save(next);
      });
    })();
  </script>
</body>
</html>
