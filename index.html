  <script>
    (function(){
      var THEMES=['gray','green','onyx','solarized'];
      var html=document.documentElement;
      function getSaved(){try{return localStorage.getItem('theme')}catch(e){return null}}
      function save(t){try{localStorage.setItem('theme',t)}catch(e){}}
      var saved=getSaved();
      if(saved&&THEMES.indexOf(saved)!==-1)html.setAttribute('data-theme',saved);
      document.getElementById('theme-btn').addEventListener('click',function(){
        var cur=html.getAttribute('data-theme')||'gray';
        var next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
        html.setAttribute('data-theme',next);save(next);
      });
      var copyBtn = document.getElementById('email-copy-btn');
      var EMAIL   = 'aansaridan@gmail.com';
      var timer   = null;

      copyBtn.addEventListener('click', function(){
        if(copyBtn.classList.contains('copied')) return;

        // Show tick immediately
        copyBtn.classList.add('copied');
        copyBtn.setAttribute('aria-label','Copied');
        timer = setTimeout(function(){
          copyBtn.classList.remove('copied');
          copyBtn.setAttribute('aria-label','Copy email address');
        }, 5000);

        // Copy to clipboard
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(EMAIL).catch(function(){ fallback(); });
        } else {
          fallback();
        }
      });

      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = EMAIL;
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try{ document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta);
      }
    })();
  </script>
